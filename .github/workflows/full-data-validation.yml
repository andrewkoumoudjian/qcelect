name: full-data-validation

on:
  push:
    branches:
      - feature/official-results-maps-ui

jobs:
  validate:
    if: contains(github.event.head_commit.message, '[full-data]')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/validate_official_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-data-validation
          path: |
            data/generated/official-data-validation.json
            data/generated/historical/diagnostics.json
            data/generated/transposition/*-diagnostics.json
          if-no-files-found: error
